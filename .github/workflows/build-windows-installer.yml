name: Build Windows Installer

on:
  push:
    branches: [main]
    paths:
      - 'installer/windows/**'
      - 'images/icon_128.png'
      - '.github/workflows/build-windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generate SnapStream Windows icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $png = (Resolve-Path 'images/icon_128.png').Path
          $out = Join-Path $env:GITHUB_WORKSPACE 'installer/windows/SnapStreamInstaller/SnapStream.ico'
          $bmp = [System.Drawing.Bitmap]::FromFile($png)
          try {
            $handle = $bmp.GetHicon()
            $icon = [System.Drawing.Icon]::FromHandle($handle)
            try {
              $stream = [System.IO.File]::Open($out, [System.IO.FileMode]::Create)
              try { $icon.Save($stream) } finally { $stream.Dispose() }
            } finally { $icon.Dispose() }
          } finally { $bmp.Dispose() }
          if (-not (Test-Path $out)) { throw 'SnapStream.ico was not generated.' }

      - name: Restore
        run: dotnet restore installer/windows/SnapStreamInstaller/SnapStreamInstaller.csproj

      - name: Publish lite app
        run: dotnet publish installer/windows/SnapStreamInstaller/SnapStreamInstaller.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=false -p:DebugType=None -p:DebugSymbols=false -o dist/windows-lite

      - name: Publish compressed full app
        run: dotnet publish installer/windows/SnapStreamInstaller/SnapStreamInstaller.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o dist/windows-full

      - name: Verify app outputs
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/windows-lite/SnapStream.exe')) { throw 'Lite SnapStream.exe was not produced.' }
          if (-not (Test-Path 'dist/windows-full/SnapStream.exe')) { throw 'Full SnapStream.exe was not produced.' }

      - name: Optional Authenticode sign apps
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) { Write-Host 'No signing certificate configured; apps remain unsigned.'; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'snapstream-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter signtool.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found.' }
          foreach ($file in @('dist/windows-lite/SnapStream.exe', 'dist/windows-full/SnapStream.exe')) {
            & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD $file
            if ($LASTEXITCODE -ne 0) { throw "Signing $file failed." }
          }

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler is unavailable.' }

      - name: Build lite and full setup installers
        shell: pwsh
        run: |
          $sourceIssPath = 'installer/windows/SnapStreamInstaller/SnapStreamSetup.iss'
          $sourceIss = Get-Content $sourceIssPath -Raw
          $liteIss = $sourceIss.Replace('OutputBaseFilename=SnapStreamSetup', 'OutputBaseFilename=SnapStreamSetup-Lite').Replace('dist\windows\*', 'dist\windows-lite\*')
          $fullIss = $sourceIss.Replace('OutputBaseFilename=SnapStreamSetup', 'OutputBaseFilename=SnapStreamSetup-Full').Replace('dist\windows\*', 'dist\windows-full\*')
          Set-Content 'installer/windows/SnapStreamInstaller/SnapStreamSetup-Lite.generated.iss' $liteIss -Encoding utf8
          Set-Content 'installer/windows/SnapStreamInstaller/SnapStreamSetup-Full.generated.iss' $fullIss -Encoding utf8
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'installer/windows/SnapStreamInstaller/SnapStreamSetup-Lite.generated.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Lite Inno Setup build failed.' }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'installer/windows/SnapStreamInstaller/SnapStreamSetup-Full.generated.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Full Inno Setup build failed.' }
          if (-not (Test-Path 'dist/SnapStreamSetup-Lite.exe')) { throw 'SnapStreamSetup-Lite.exe was not produced.' }
          if (-not (Test-Path 'dist/SnapStreamSetup-Full.exe')) { throw 'SnapStreamSetup-Full.exe was not produced.' }
          Copy-Item 'dist/SnapStreamSetup-Lite.exe' 'dist/SnapStreamSetup.exe' -Force

      - name: Optional Authenticode sign installers
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) { Write-Host 'No signing certificate configured; installers remain unsigned.'; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'snapstream-signing.pfx'
          if (-not (Test-Path $pfx)) { [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)) }
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter signtool.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found.' }
          foreach ($file in @('dist/SnapStreamSetup.exe', 'dist/SnapStreamSetup-Lite.exe', 'dist/SnapStreamSetup-Full.exe')) {
            & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD $file
            if ($LASTEXITCODE -ne 0) { throw "Signing $file failed." }
          }

      - name: Generate checksums
        shell: pwsh
        run: |
          foreach ($file in @('SnapStreamSetup.exe', 'SnapStreamSetup-Lite.exe', 'SnapStreamSetup-Full.exe')) {
            $path = Join-Path 'dist' $file
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
            "$hash  $file" | Set-Content (Join-Path 'dist' ($file -replace '\.exe$', '.sha256')) -Encoding ascii
          }
          Get-ChildItem dist -Filter 'SnapStreamSetup*.exe' | Select-Object Name,Length

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapStream-Windows-Installer
          path: |
            dist/SnapStreamSetup.exe
            dist/SnapStreamSetup.sha256
            dist/SnapStreamSetup-Lite.exe
            dist/SnapStreamSetup-Lite.sha256
            dist/SnapStreamSetup-Full.exe
            dist/SnapStreamSetup-Full.sha256
          if-no-files-found: error

      - name: Publish stable installer download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view installer-latest --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) { gh release create installer-latest --repo $env:GITHUB_REPOSITORY --title 'SnapStream Windows Installer' --notes 'Installable SnapStream Windows Manager.' }
          gh release edit installer-latest --repo $env:GITHUB_REPOSITORY --title 'SnapStream Windows Installer' --notes 'Lite is the small installer for PCs that already have .NET Desktop Runtime 8. Full is the self-contained fallback. Both install SnapStream as a Windows app with Start Menu/optional Desktop shortcut, automatic GitHub extension update checks, browser detection, and guided first-time browser activation. Chrome-based browsers still require one manual Developer mode + Load unpacked approval for off-store activation.'
          gh release upload installer-latest dist/SnapStreamSetup.exe dist/SnapStreamSetup.sha256 dist/SnapStreamSetup-Lite.exe dist/SnapStreamSetup-Lite.sha256 dist/SnapStreamSetup-Full.exe dist/SnapStreamSetup-Full.sha256 --clobber --repo $env:GITHUB_REPOSITORY
