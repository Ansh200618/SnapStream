<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SnapStream</title>
  <link rel="stylesheet" href="../stylesheets/launcher.css" />
</head>
<body>
  <main class="launcher-shell">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <header class="brand-row">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><path d="M8 8.5A3.5 3.5 0 0 1 11.5 5h9A3.5 3.5 0 0 1 24 8.5v15a3.5 3.5 0 0 1-3.5 3.5h-9A3.5 3.5 0 0 1 8 23.5v-15Z"/><path d="m11 21 4.2-4.4 2.8 2.7 2.8-3.2L24 20"/><circle cx="19.5" cy="11.5" r="2"/></svg>
      </div>
      <div class="brand-copy">
        <strong>SnapStream</strong>
        <span>Image extraction studio</span>
      </div>
      <span class="status-badge"><i></i> Ready</span>
    </header>

    <section class="hero-copy">
      <span class="eyebrow">Choose a workspace</span>
      <h1>Scan the page your way.</h1>
      <p>Stay beside the website for quick work, or switch to the full canvas for large galleries and deep scans.</p>
    </section>

    <section class="choices" aria-label="Workspace options">
      <button class="choice" id="open-side-panel" type="button">
        <span class="choice-number">01</span>
        <span class="choice-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M14.5 4v16"/></svg>
        </span>
        <span class="choice-copy">
          <strong>Side panel</strong>
          <small>Fast scan while the source page stays visible.</small>
          <b>Best for quick grabs</b>
        </span>
        <svg class="arrow" viewBox="0 0 20 20" aria-hidden="true"><path d="m7 4 6 6-6 6"/></svg>
      </button>

      <button class="choice featured" id="open-workspace" type="button">
        <span class="choice-number">02</span>
        <span class="choice-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/></svg>
        </span>
        <span class="choice-copy">
          <strong>Full workspace</strong>
          <small>Room for hundreds of images, filters, previews and bulk download.</small>
          <b>Recommended for deep scan</b>
        </span>
        <svg class="arrow" viewBox="0 0 20 20" aria-hidden="true"><path d="m7 4 6 6-6 6"/></svg>
      </button>
    </section>

    <footer>
      <span>Deep scanner</span>
      <span class="footer-dot"></span>
      <span>Lazy-load aware</span>
      <span class="footer-dot"></span>
      <span>Bulk download</span>
    </footer>
  </main>
  <script src="../src/launcher.js"></script>
</body>
</html>
