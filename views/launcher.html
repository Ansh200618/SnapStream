<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SnapStream</title>
  <link rel="stylesheet" href="../stylesheets/launcher.css" />
</head>
<body>
  <main class="launcher-shell">
    <header class="brand-row">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><path d="M8 8.5A3.5 3.5 0 0 1 11.5 5h9A3.5 3.5 0 0 1 24 8.5v15a3.5 3.5 0 0 1-3.5 3.5h-9A3.5 3.5 0 0 1 8 23.5v-15Z"/><path d="m11 21 4.2-4.4 2.8 2.7 2.8-3.2L24 20"/><circle cx="19.5" cy="11.5" r="2"/></svg>
      </div>
      <div>
        <div class="brand-name">SnapStream</div>
        <div class="brand-subtitle">Image discovery workspace</div>
      </div>
    </header>

    <section class="intro">
      <span class="eyebrow">Choose your workspace</span>
      <h1>How do you want to scan?</h1>
      <p>Use a compact panel beside the website, or open the full image workspace in a new tab.</p>
    </section>

    <section class="choices" aria-label="Workspace options">
      <button class="choice primary" id="open-side-panel" type="button">
        <span class="choice-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
        </span>
        <span class="choice-copy"><strong>Open Side Panel</strong><small>Scan while staying on the website</small></span>
        <svg class="arrow" viewBox="0 0 20 20" aria-hidden="true"><path d="m7 4 6 6-6 6"/></svg>
      </button>

      <button class="choice" id="open-workspace" type="button">
        <span class="choice-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M8 4v5"/></svg>
        </span>
        <span class="choice-copy"><strong>Open Full Workspace</strong><small>Best for hundreds of images</small></span>
        <svg class="arrow" viewBox="0 0 20 20" aria-hidden="true"><path d="m7 4 6 6-6 6"/></svg>
      </button>
    </section>

    <footer>
      <span class="status-dot"></span>
      <span>Ready for deep scanning</span>
      <span class="version">Deep scan</span>
    </footer>
  </main>
  <script src="../src/launcher.js"></script>
</body>
</html>
